name: CA trust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression tests with public CA fixtures
        run: node --test scripts/ca-trust.test.mjs
      - run: docker build --pull --target base -t ca-voterr .
      - run: docker run --rm --entrypoint sh -v "$PWD/scripts:/checks:ro" ca-voterr /checks/check-ca-trust.sh /checks/ca-fixtures
